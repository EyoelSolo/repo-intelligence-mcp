[project]
name = "repo-intelligence-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "EyoelSolo", email = "eyoelaweke@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]>=2.2.0",
    "pytest>=9.1.1",
    "tree-sitter>=0.26.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
]

[project.scripts]
repo-intelligence-mcp = "repo_intelligence_mcp:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "."
module-name = ["app", "repo_intelligence_mcp"]
